# Railway service: api (NestJS)
# In Railway UI: Config file path = apps/api/railway.toml

[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @game-is-game/db exec prisma generate && pnpm --filter @game-is-game/shared build && pnpm --filter @game-is-game/api build"

[deploy]
preDeployCommand = "pnpm --filter @game-is-game/db exec prisma migrate deploy"
startCommand = "pnpm --filter @game-is-game/api start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
