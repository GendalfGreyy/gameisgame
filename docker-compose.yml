services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: gamegame
      POSTGRES_PASSWORD: gamegame
      POSTGRES_DB: gamegame
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamegame -d gamegame']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-shadow:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: gamegame
      POSTGRES_PASSWORD: gamegame
      POSTGRES_DB: gamegame_shadow
    volumes:
      - postgres_shadow_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamegame -d gamegame_shadow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_shadow_data:
  redis_data:
